[package]
name = "btc-treasury"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Telegram
teloxide = { version = "0.13", features = ["macros"] }

# Crypto (Binance HMAC-SHA256 signing + wallet encryption)
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
signature = "2.1"
async-trait = "0.1"
