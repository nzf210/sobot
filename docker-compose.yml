services:
  backend:
    build: ./backend-go
    container_name: solana-hybrid-backend
    # Default port 8089 (override with BACKEND_PORT env var)
    ports:
      - "${BACKEND_PORT:-8089}:${BACKEND_PORT:-8089}"
    env_file:
      - .env
    volumes:
      - ./data/memory:/app/data/memory
    environment:
      - EXECUTOR_PORT=${EXECUTOR_PORT:-3009}
      - EXECUTOR_HOST=executor
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  executor:
    build: ./executor-ts
    container_name: solana-hybrid-executor
    # Default port 3009 (override with EXECUTOR_PORT env var)
    ports:
      - "${EXECUTOR_PORT:-3009}:${EXECUTOR_PORT:-3009}"
    env_file:
      - .env
    volumes:
      - ./executor-ts/wallet.enc:/app/wallet.enc
    environment:
      - WALLET_PATH=wallet.enc
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  # ── BTC Treasury (headless worker) ─────────────────────────────────────────
  # Connects to an external PostgreSQL instance via DB_DSN from .env
  btc-treasury:
    build: ./btc-treasury
    container_name: solana-hybrid-btc-treasury
    # No exposed ports — driven entirely via Telegram commands and background loops.
    env_file:
      - .env
    volumes:
      - ./data/btc-treasury:/app/data/btc-treasury
    environment:
      - DATA_BTC_DIR=/app/data/btc-treasury
      # DB_DRIVER and DB_DSN must be set in .env pointing to your external PostgreSQL
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_DSN=${DB_DSN}
    restart: unless-stopped
    networks:
      - solana-net
      - shared-db-network

networks:
  solana-net:
    driver: bridge
  shared-db-network:
    external: true