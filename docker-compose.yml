version: '3.8'

services:
  backend:
    build: ./backend-go
    container_name: solana-hybrid-backend
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./data/memory:/app/data/memory
    environment:
      - EXECUTOR_PORT=${EXECUTOR_PORT:-3000}
      - EXECUTOR_HOST=executor
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  executor:
    build: ./executor-ts
    container_name: solana-hybrid-executor
    ports:
      - "${EXECUTOR_PORT:-3000}:${EXECUTOR_PORT:-3000}"
    env_file:
      - .env
    volumes:
      - ./executor-ts/wallet.enc:/app/wallet.enc
    environment:
      - WALLET_PATH=wallet.enc
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  btc-treasury:
    build: ./btc-treasury
    container_name: solana-hybrid-btc-treasury
    ports:
      - "${BTC_TREASURY_PORT:-8090}:${BTC_TREASURY_PORT:-8090}"
    env_file:
      - .env
    volumes:
      - ./hyperliquid.enc:/app/hyperliquid.enc
      - ./data/btc-treasury:/app/data/btc-treasury
    environment:
      - HYPERLIQUID_KEY_PATH=hyperliquid.enc
      - DATA_DIR=/app/data/btc-treasury
    restart: unless-stopped
    networks:
      - solana-net

networks:
  solana-net:
    driver: bridge
