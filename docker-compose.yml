services:
  backend:
    build: ./backend-go
    container_name: solana-hybrid-backend
    # Default port 8089 (override with BACKEND_PORT env var)
    ports:
      - "${BACKEND_PORT:-8089}:${BACKEND_PORT:-8089}"
    env_file:
      - .env
    volumes:
      - ./data/memory:/app/data/memory
    environment:
      - EXECUTOR_PORT=${EXECUTOR_PORT:-3009}
      - EXECUTOR_HOST=executor
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  executor:
    build: ./executor-ts
    container_name: solana-hybrid-executor
    # Default port 3009 (override with EXECUTOR_PORT env var)
    ports:
      - "${EXECUTOR_PORT:-3009}:${EXECUTOR_PORT:-3009}"
    env_file:
      - .env
    volumes:
      - ./executor-ts/wallet.enc:/app/wallet.enc
    environment:
      - WALLET_PATH=wallet.enc
      - EXECUTOR_API_KEY=${EXECUTOR_API_KEY}
    restart: unless-stopped
    networks:
      - solana-net

  btc-treasury:
    build: ./btc-treasury
    container_name: solana-hybrid-btc-treasury
    # No exposed ports — runs as a headless worker driving the BTC Telegram bot
    # and scanner. State is consumed only through Telegram commands.
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/btc-treasury:/app/data/btc-treasury
    environment:
      - DATA_BTC_DIR=/app/data/btc-treasury
      - WALLET_PASSWORD=${WALLET_PASSWORD}
      - DB_DSN=postgres://botbtc:botbtc123@host.docker.internal:5432/dbbtcbot?sslmode=disable
    restart: unless-stopped
    networks:
      - solana-net

networks:
  solana-net:
    driver: bridge
